<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FED Badge Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #eef3f8;
    --panel: #ffffff;
    --panel-alt: #f4f8fc;
    --border: #d9e3ee;
    --navy: #3f6a95;
    --navy-dark: #2f5578;
    --text: #1c2b3a;
    --text-soft: #5b7086;
    --red: #c0392b;
    --red-dark: #a5311f;
    --green: #1aa260;
    --amber: #b9740a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; color: var(--text); }
  #fed-badge-wrapper { background: var(--bg); width: 100%; }

  #fed-nav { background: var(--red); padding: 8px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #fed-nav .label { color: #fff; font-size: 12px; font-weight: bold; margin-right: 8px; }
  #fed-nav a { padding: 5px 14px; background: var(--navy); color: #fff; border-radius: 5px; font-size: 12px; font-weight: bold; text-decoration: none; display: inline-block; }
  #fed-nav a:hover { background: var(--navy-dark); }
  #fed-nav a.current { background: var(--red-dark); }

  #controls {
    background: var(--navy); color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
  }
  #controls label { font-size: 12px; display: block; margin-bottom: 4px; color: #dfeaf5; }
  #controls input, #controls select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; min-width: 140px; max-width: 200px; }
  .btn { padding: 8px 18px; border-radius: 6px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; color: #fff; }
  .btn-primary { background: var(--red); }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-print { background: var(--green); }
  .btn-print:hover { background: #15804d; }
  .btn-neutral { background: var(--navy-dark); }
  .btn-neutral:hover { background: #24476b; }
  .btn-muted { background: #8a97a3; }

  #status { font-size: 13px; padding: 8px 12px; background: rgba(255,255,255,0.15); border-radius: 6px; align-self: center; min-width: 200px; }

  #queue-panel { background: var(--panel-alt); border-bottom: 2px solid var(--border); padding: 12px 16px; }
  #queue-panel-title { font-size: 15px; font-weight: bold; color: var(--navy-dark); margin-bottom: 8px; }
  #queue-panel-title .sub { font-weight: normal; font-size: 12px; color: var(--text-soft); }
  #queue-search-results, #queue-list { max-height: 180px; overflow-y: auto; background: #fff; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; }
  #queue-list { max-height: 160px; padding: 4px; }
  .queue-result-row { display: block; padding: 6px 10px; font-size: 13px; border-bottom: 1px solid var(--panel-alt); }
  .queue-result-row.already { color: var(--text-soft); }
  .queue-item-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; font-size: 13px; border-bottom: 1px solid var(--panel-alt); }
  .queue-remove-btn { padding: 2px 8px; border-radius: 4px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; background: var(--red); color: #fff; }
  .queue-temp-tag { background: var(--amber); color: #fff; font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 8px; margin-right: 6px; letter-spacing: 0.5px; }
  #queue-status { font-size: 12px; color: var(--text-soft); margin-top: 6px; }

  #badge-area { padding: 16px; overflow-x: auto; }
  .page { display: grid; grid-template-columns: repeat(4, 2.5in); gap: 0.2in; margin-bottom: 0.3in; justify-content: start; min-width: calc(4 * 2.5in + 3 * 0.2in); }

  .badge { width: 2.5in; height: 3.5in; border: 2px solid var(--border); border-radius: 12px; background: #fff; display: flex; flex-direction: column; align-items: center; padding: 8px 8px 10px; position: relative; overflow: hidden; }
  .badge-logo { width: 1.45in; height: auto; object-fit: contain; margin-bottom: 2px; }
  .badge-name { font-size: 22px; font-weight: bold; text-align: center; color: var(--text); line-height: 1.1; margin-bottom: 3px; }
  .badge-role { font-size: 18px; color: var(--red); font-weight: bold; text-align: center; margin-bottom: 2px; }
  .badge-grade { font-size: 13px; color: var(--text); text-align: center; margin-bottom: 4px; }
  .badge-qr { margin-top: auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 2px; }
  .badge-qr canvas, .badge-qr img { width: 0.85in !important; height: 0.85in !important; }
  .badge-id { font-size: 8px; color: var(--text-soft); margin-top: 3px; letter-spacing: 0.5px; }

  .badge-back { width: 2.5in; height: 3.5in; border: 2px solid var(--border); border-radius: 12px; background: #fff; font-family: Arial, sans-serif; position: relative; overflow: hidden; }
  .badge-back-rot { position: absolute; top: 50%; left: 50%; width: 3.5in; height: 2.5in; transform: translate(-50%, -50%) rotate(-90deg); transform-origin: center center; display: flex; flex-direction: column; padding: 10px 14px; box-sizing: border-box; }
  .badge-back-name { font-size: 16px; font-weight: bold; text-align: center; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 4px; }
  .badge-back-emergency { font-size: 11px; color: var(--red); font-weight: bold; text-align: center; margin-bottom: 5px; }
  .badge-back-schedule { display: flex; flex-direction: column; gap: 3px; }
  .badge-back-period { display: flex; gap: 8px; font-size: 11px; color: var(--text); line-height: 1.3; padding: 3px 6px; border-radius: 3px; background: var(--panel-alt); align-items: baseline; }
  .badge-back-time { color: var(--navy); font-weight: bold; white-space: nowrap; min-width: 64px; }
  .badge-back-class { flex: 1; }
  .badge-back-room { color: var(--red); font-weight: bold; white-space: nowrap; margin-left: 6px; }
  .badge-back-noclass { font-size: 10px; color: var(--text-soft); text-align: center; margin-top: 8px; font-style: italic; }
  .badge-back-bell-title { font-size: 13px; font-weight: bold; color: var(--navy); margin-bottom: 4px; text-align: center; }
  .badge-back-bell-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; }
  .badge-back-verse { margin-top: auto; padding-top: 5px; border-top: 1px solid var(--border); font-size: 8px; line-height: 1.3; color: var(--text-soft); text-align: center; font-style: italic; }
  .badge-back-verse .ref { font-style: normal; font-weight: bold; color: var(--red); }
  .badge-warn { width: 82px; height: 82px; background: #fdf3e0; border: 2px solid #f0cf8f; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; }
  .badge-warn-text { font-size: 8px; color: var(--amber); font-weight: bold; text-align: center; line-height: 1.3; }

  @media print {
    #fed-nav, #controls, #queue-panel { display: none; }
    body { background: #fff; }
    #badge-area { padding: 0; }
    .page { grid-template-columns: repeat(4, 2.5in); gap: 0.15in; page-break-after: always; justify-content: start; padding: 0.25in; }
  }
</style>
</head>
<body>
<div id="fed-badge-wrapper">

<div id="fed-nav">
  <span class="label">FED Admin:</span>
  <a href="dashboard.html">Campus Dashboard</a>
  <a href="badge-generator.html" class="current">Badge Generator</a>
  <a href="attendance-kiosk.html">Attendance Kiosk</a>
  <a href="service-kiosk.html">Service Kiosk</a>
</div>

<div id="controls">
  <div style="font-size:16px;font-weight:bold;color:#fff;align-self:center;white-space:nowrap;padding-right:8px;">FED Badge Generator</div>
  <div><label>Filter by Role</label>
    <select id="filter-role">
      <option value="">All Roles</option>
      <option value="Administrator">Administrator</option>
      <option value="Tutor">Tutor</option>
      <option value="Adult">Adult</option>
      <option value="Student">Student</option>
    </select>
  </div>
  <div><label>Search by Name or Family</label><input id="filter-search" placeholder="Type to filter..." type="text"></div>
  <div><label>&nbsp;</label><button id="load-btn" class="btn btn-primary">Load Badges</button></div>
  <div><label>&nbsp;</label><button id="print-btn" class="btn btn-print">Print / Save PDF</button></div>
  <div id="status">Click Load Badges to begin</div>
</div>

<div id="queue-panel">
  <div id="queue-panel-title">Print Queue <span class="sub">— shared across stations</span></div>
  <div style="margin-bottom:8px;">
    <label style="font-size:12px;display:block;margin-bottom:4px;color:var(--navy-dark);">Search to add to queue</label>
    <input id="queue-search" placeholder="Type a name or family..." type="text" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:13px;min-width:220px;max-width:280px;">
    <button id="add-to-queue-btn" class="btn btn-primary" style="margin-left:8px;">Add Checked to Queue</button>
  </div>
  <div id="queue-search-results">&nbsp;</div>
  <div style="margin-bottom:8px;">
    <label style="font-size:12px;display:block;margin-bottom:4px;color:var(--navy-dark);">Add a replacement temp badge</label>
    <input id="temp-badge-input" placeholder="Badge ID, e.g. TEMP-07" type="text" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:13px;min-width:180px;max-width:220px;">
    <button id="add-temp-badge-btn" class="btn btn-primary" style="margin-left:8px;">Add Temp Badge to Queue</button>
  </div>
  <div style="font-size:13px;font-weight:bold;color:var(--navy-dark);margin-bottom:6px;">Staged (<span id="queue-count">0</span>)</div>
  <div id="queue-list">&nbsp;</div>
  <div>
    <button id="refresh-queue-btn" class="btn btn-neutral">Refresh Queue</button>
    <button id="print-queue-btn" class="btn btn-print">Print Queue</button>
    <button id="clear-queue-btn" class="btn btn-muted">Clear Queue</button>
  </div>
  <div id="queue-status">Queue not loaded yet — click Refresh Queue.</div>
</div>

<div id="badge-area">&nbsp;</div>

<script>
const LOGO_URL = 'https://www.familyeducationdays.com/tx/familyeducationdays/2026/26-27%20Logo.png';
let allPeople   = [];
let allSchedule = {};

function mirrorRowsOfFour(arr) {
  const result = [];
  for (let i = 0; i < arr.length; i += 4) result.push(...arr.slice(i, i + 4).reverse());
  return result;
}

const BELL_SCHEDULE = [
  { time: '8:15',  label: '1st Period' }, { time: '9:15',  label: '2nd Period' },
  { time: '10:15', label: '3rd Period' }, { time: '12:00', label: '4th Period' },
  { time: '1:00',  label: '5th Period' }, { time: '2:00',  label: '6th Period' },
  { time: '3:00',  label: '7th Period' },
];

const YEAR_VERSE_TEXT = '"You shall love the LORD your God with all your heart and with all your soul and with all your might. And these words that I command you today shall be on your heart. You shall teach them diligently to your children, and shall talk of them when you sit in your house, and when you walk by the way, and when you lie down, and when you rise."';
const YEAR_VERSE_REF  = 'Deuteronomy 6:5-7';

const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxQTULyjaWTitjvrbaTp3SNgrTggvkQHUuL_A5ps5naR6egVj3OGAUUL_o0sdZK9Bdo/exec';

const QUEUE_BIN_ID  = '6a68d28cf5f4af5e29cda0bf';
const QUEUE_API_KEY = '$2a$10$oUvFiF7QOQw1s6SmYEz52e8mlDA8j1EFQY87ANaWUt6LvywzXMAmO';
const QUEUE_BIN_URL = 'https://api.jsonbin.io/v3/b/' + QUEUE_BIN_ID;

let localQueue = [];

async function loadAndRender() {
  setStatus('Loading people from Google Sheet...');
  document.getElementById('badge-area').innerHTML = '';
  try {
    const [peopleRes, scheduleRes] = await Promise.all([
      fetch(WEBAPP_URL + '?action=getPeople'),
      fetch(WEBAPP_URL + '?action=getSchedule')
    ]);
    const peopleData   = await peopleRes.json();
    const scheduleData = await scheduleRes.json();
    if (peopleData.error) { setStatus('Error: ' + peopleData.error); return; }
    allPeople   = peopleData.people;
    allSchedule = scheduleData.schedule || {};
    setStatus('Loaded ' + allPeople.length + ' people');
    renderBadges();
  } catch (err) { setStatus('Failed to load: ' + err.message); }
}

function getFiltered() {
  const roleFilter   = document.getElementById('filter-role').value;
  const searchFilter = document.getElementById('filter-search').value.trim().toLowerCase();
  return allPeople.filter(p => {
    if (roleFilter && p.role !== roleFilter) return false;
    if (searchFilter && !(p.displayName + ' ' + p.familyName).toLowerCase().includes(searchFilter)) return false;
    return true;
  });
}

function renderBadges() {
  const filtered = getFiltered();
  const blocked = filtered.filter(p => p.type !== 'Student' && (!p.bgCheckDate || p.bgCheckDate === '')).length;
  setStatus('Showing ' + filtered.length + ' of ' + allPeople.length + ' people' + (blocked > 0 ? ' — ' + blocked + ' missing BG check (no BG date)' : ''));

  const area = document.getElementById('badge-area');
  area.innerHTML = '';
  const perPage = 8;
  for (let i = 0; i < filtered.length; i += perPage) {
    const chunk = filtered.slice(i, i + perPage);
    const frontPage = document.createElement('div');
    frontPage.className = 'page';
    chunk.forEach(person => frontPage.appendChild(buildBadgeFront(person)));
    area.appendChild(frontPage);

    const backPage = document.createElement('div');
    backPage.className = 'page';
    mirrorRowsOfFour(chunk).forEach(person => backPage.appendChild(buildBadgeBack(person)));
    area.appendChild(backPage);
  }
}

function buildBadgeFront(person) {
  const wrapper = document.createElement('div');
  wrapper.className = 'badge';

  const logo = document.createElement('img');
  logo.src = LOGO_URL; logo.className = 'badge-logo'; logo.alt = 'FED Logo';
  wrapper.appendChild(logo);

  const name = document.createElement('div');
  name.className = 'badge-name'; name.textContent = person.displayName;
  wrapper.appendChild(name);

  const role = document.createElement('div');
  role.className = 'badge-role'; role.textContent = person.role || 'Adult';
  wrapper.appendChild(role);

  if (person.type === 'Student' && person.grade) {
    const grade = document.createElement('div');
    grade.className = 'badge-grade'; grade.textContent = person.grade;
    wrapper.appendChild(grade);
  }

  const qrWrap = document.createElement('div');
  qrWrap.className = 'badge-qr';
  wrapper.appendChild(qrWrap);

  const needsBGCheck = person.type !== 'Student' && (!person.bgCheckDate || person.bgCheckDate === '');
  if (needsBGCheck) {
    qrWrap.innerHTML = '<div class="badge-warn"><div style="font-size:18px;">!</div><div class="badge-warn-text">Background<br>check<br>required</div></div>';
  } else {
    new QRCode(qrWrap, { text: person.personID, width: 86, height: 86, correctLevel: QRCode.CorrectLevel.M });
  }

  const pid = document.createElement('div');
  pid.className = 'badge-id';
  pid.textContent = needsBGCheck ? '— no BG check on file —' : person.personID;
  wrapper.appendChild(pid);

  return wrapper;
}

function buildBadgeBack(person) {
  const wrapper = document.createElement('div');
  wrapper.className = 'badge-back';
  const rot = document.createElement('div');
  rot.className = 'badge-back-rot';
  wrapper.appendChild(rot);

  const name = document.createElement('div');
  name.className = 'badge-back-name'; name.textContent = person.displayName;
  rot.appendChild(name);

  if (person.type === 'Student') {
    const ec = document.createElement('div');
    ec.className = 'badge-back-emergency';
    ec.textContent = 'Emergency: ' + (person.phone && person.phone !== '' ? person.phone : 'See office');
    rot.appendChild(ec);

    const schedDiv = document.createElement('div');
    schedDiv.className = 'badge-back-schedule';
    const classes = allSchedule[person.personID] || [];
    if (classes.length === 0) {
      const noClass = document.createElement('div');
      noClass.className = 'badge-back-noclass'; noClass.textContent = 'No classes on file';
      schedDiv.appendChild(noClass);
    } else {
      classes.forEach(cls => {
        const period = document.createElement('div');
        period.className = 'badge-back-period';
        const timeEl = document.createElement('span');
        timeEl.className = 'badge-back-time'; timeEl.textContent = cls.startTime;
        const classEl = document.createElement('span');
        classEl.className = 'badge-back-class'; classEl.textContent = cls.className;
        period.appendChild(timeEl); period.appendChild(classEl);
        if (cls.location) {
          const roomEl = document.createElement('span');
          roomEl.className = 'badge-back-room'; roomEl.textContent = cls.location;
          period.appendChild(roomEl);
        }
        schedDiv.appendChild(period);
      });
    }
    rot.appendChild(schedDiv);
  } else {
    const bellTitle = document.createElement('div');
    bellTitle.className = 'badge-back-bell-title'; bellTitle.textContent = 'FED Bell Schedule';
    rot.appendChild(bellTitle);
    const bellGrid = document.createElement('div');
    bellGrid.className = 'badge-back-bell-grid';
    BELL_SCHEDULE.forEach(b => {
      const period = document.createElement('div');
      period.className = 'badge-back-period';
      const timeEl = document.createElement('span'); timeEl.className = 'badge-back-time'; timeEl.textContent = b.time;
      const labelEl = document.createElement('span'); labelEl.className = 'badge-back-class'; labelEl.textContent = b.label;
      period.appendChild(timeEl); period.appendChild(labelEl);
      bellGrid.appendChild(period);
    });
    rot.appendChild(bellGrid);
  }

  const verse = document.createElement('div');
  verse.className = 'badge-back-verse';
  verse.innerHTML = YEAR_VERSE_TEXT + ' <span class="ref">' + YEAR_VERSE_REF + '</span>';
  rot.appendChild(verse);

  return wrapper;
}

function openPrintView() {
  if (!allPeople.length) { alert('Load badges first before printing.'); return; }
  printPeopleList(getFiltered());
}

function buildPeoplePagesHTML(filtered) {
  const perPage = 8;
  let pagesHTML = '';
  for (let i = 0; i < filtered.length; i += perPage) {
    const chunk = filtered.slice(i, i + perPage);
    pagesHTML += '<div class="page">' + chunk.map(buildBadgeFrontHTML).join('') + '</div>';
    pagesHTML += '<div class="page">' + mirrorRowsOfFour(chunk).map(buildBadgeBackHTML).join('') + '</div>';
  }
  return pagesHTML;
}

function buildTempPagesHTML(badgeIDs) {
  const perPage = 8;
  let pagesHTML = '';
  for (let i = 0; i < badgeIDs.length; i += perPage) {
    const chunk = badgeIDs.slice(i, i + perPage);
    pagesHTML += '<div class="page">' + chunk.map(buildTempBadgeFrontHTML).join('') + '</div>';
    pagesHTML += '<div class="page">' + mirrorRowsOfFour(chunk).map(buildTempBadgeBackHTML).join('') + '</div>';
  }
  return pagesHTML;
}

function printPeopleList(filtered) {
  openPrintWindow(buildPeoplePagesHTML(filtered));
}

function openPrintWindow(pagesHTML) {
  const printHTML = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>FED Badges</title>' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><style>' +
    '* { box-sizing: border-box; margin: 0; padding: 0; } body { background: #fff; font-family: Arial, sans-serif; }' +
    '@page { size: letter landscape; margin: 0.25in; }' +
    '.page { display: grid; grid-template-columns: repeat(4, 2.5in); grid-auto-rows: 3.5in; gap: 0.15in; padding: 0; page-break-after: always; justify-content: center; align-content: center; }' +
    '.badge { width: 2.5in; height: 3.5in; border: 2px solid #222; border-radius: 12px; background: #fff; display: flex; flex-direction: column; align-items: center; padding: 8px 8px 10px; page-break-inside: avoid; overflow: hidden; }' +
    '.badge-logo { width: 1.45in; height: auto; object-fit: contain; margin-bottom: 2px; }' +
    '.badge-name { font-size: 22px; font-weight: bold; text-align: center; color: #111; line-height: 1.1; margin-bottom: 3px; }' +
    '.badge-role { font-size: 18px; color: #c0392b; font-weight: bold; text-align: center; margin-bottom: 2px; }' +
    '.badge-grade { font-size: 13px; color: #000; text-align: center; margin-bottom: 4px; }' +
    '.badge-qr { margin-top: auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 2px; }' +
    '.badge-qr canvas, .badge-qr img { width: 0.85in !important; height: 0.85in !important; }' +
    '.badge-id { font-size: 8px; color: #888; margin-top: 3px; }' +
    '.badge-warn { width:82px;height:82px;background:#fdf3e0;border:2px solid #f0cf8f;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px; }' +
    '.badge-warn-text { font-size:8px;color:#b9740a;font-weight:bold;text-align:center;line-height:1.3; }' +
    '.badge-back { width:2.5in;height:3.5in;border:2px solid #222;border-radius:12px;background:#fff;page-break-inside:avoid;font-family:Arial,sans-serif;position:relative;overflow:hidden; }' +
    '.badge-back-rot { position:absolute;top:50%;left:50%;width:3.5in;height:2.5in;transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center center;display:flex;flex-direction:column;padding:10px 14px;box-sizing:border-box; }' +
    '.badge-back-name { font-size:16px;font-weight:bold;text-align:center;color:#111;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:4px; }' +
    '.badge-back-emergency { font-size:11px;color:#c0392b;font-weight:bold;text-align:center;margin-bottom:5px; }' +
    '.badge-back-schedule { display:flex;flex-direction:column;gap:3px; }' +
    '.badge-back-period { display:flex;gap:8px;font-size:11px;color:#222;line-height:1.3;padding:3px 6px;border-radius:3px;background:#f5f5f5;align-items:baseline; }' +
    '.badge-back-time { color:#3f6a95;font-weight:bold;white-space:nowrap;min-width:64px; }' +
    '.badge-back-class { flex:1; }' +
    '.badge-back-room { color:#c0392b;font-weight:bold;white-space:nowrap;margin-left:6px; }' +
    '.badge-back-bell-title { font-size:13px;font-weight:bold;color:#3f6a95;margin-bottom:4px;text-align:center; }' +
    '.badge-back-bell-grid { display:grid;grid-template-columns:1fr 1fr;gap:3px 8px; }' +
    '.badge-back-verse { margin-top:auto;padding-top:5px;border-top:1px solid #ddd;font-size:8px;line-height:1.3;color:#555;text-align:center;font-style:italic; }' +
    '.badge-back-verse .ref { font-style:normal;font-weight:bold;color:#c0392b; }' +
    '.badge-temp { border: 3px dashed #b9740a !important; }' +
    '.badge-temp-title { color:#b9740a; }' +
    '<\/style></head><body>' + pagesHTML +
    '<script>document.querySelectorAll("[data-qr]").forEach(function(el){new QRCode(el,{text:el.getAttribute("data-qr"),width:86,height:86,correctLevel:QRCode.CorrectLevel.M});});' +
    'window.onload=function(){setTimeout(function(){window.print();},800);};<\/script></body></html>';

  const blob = new Blob([printHTML], { type: 'text/html' });
  window.open(URL.createObjectURL(blob), '_blank');
}

function buildBadgeFrontHTML(person) {
  const needsBGCheck = person.type !== 'Student' && (!person.bgCheckDate || person.bgCheckDate === '');
  const qrSection = needsBGCheck
    ? '<div class="badge-warn"><div style="font-size:14px;">!</div><div class="badge-warn-text">Background<br>check<br>required</div></div>'
    : '<div data-qr="' + person.personID + '"></div>';
  return '<div class="badge">' +
    '<img class="badge-logo" src="' + LOGO_URL + '" alt="FED">' +
    '<div class="badge-name">' + person.displayName + '</div>' +
    '<div class="badge-role">' + (person.role || 'Adult') + '</div>' +
    (person.type === 'Student' && person.grade ? '<div class="badge-grade">' + person.grade + '</div>' : '') +
    '<div class="badge-qr">' + qrSection + '<div class="badge-id">' + (needsBGCheck ? '— no BG check —' : person.personID) + '</div></div>' +
    '</div>';
}

function buildBadgeBackHTML(person) {
  const verseHTML = '<div class="badge-back-verse">' + YEAR_VERSE_TEXT + ' <span class="ref">' + YEAR_VERSE_REF + '</span></div>';
  if (person.type === 'Student') {
    const classes = allSchedule[person.personID] || [];
    const classRows = classes.length
      ? classes.map(c => {
          const room = c.location ? '<span class="badge-back-room">' + c.location + '</span>' : '';
          return '<div class="badge-back-period"><span class="badge-back-time">' + c.startTime + '</span><span class="badge-back-class">' + c.className + '</span>' + room + '</div>';
        }).join('')
      : '<div style="font-size:10px;color:#aaa;text-align:center;margin-top:8px;">No classes on file</div>';
    return '<div class="badge-back"><div class="badge-back-rot">' +
      '<div class="badge-back-name">' + person.displayName + '</div>' +
      '<div class="badge-back-emergency">Emergency: ' + (person.phone || 'See office') + '</div>' +
      '<div class="badge-back-schedule">' + classRows + '</div>' + verseHTML + '</div></div>';
  }
  const bellRows = BELL_SCHEDULE.map(b => '<div class="badge-back-period"><span class="badge-back-time">' + b.time + '</span><span class="badge-back-class">' + b.label + '</span></div>').join('');
  return '<div class="badge-back"><div class="badge-back-rot">' +
    '<div class="badge-back-name">' + person.displayName + '</div>' +
    '<div class="badge-back-bell-title">FED Bell Schedule</div>' +
    '<div class="badge-back-bell-grid">' + bellRows + '</div>' + verseHTML + '</div></div>';
}

// ── REPLACEMENT TEMP BADGES ──────────────────────────────────────────────
// These are blank, reusable physical badges (not tied to any one person) —
// scanning one at the kiosk is what asks "member or visitor?" and assigns
// it for the day. The dashed amber border makes them easy to spot on a
// printed sheet mixed in with real member badges.
function buildTempBadgeFrontHTML(badgeID) {
  return '<div class="badge badge-temp">' +
    '<img class="badge-logo" src="' + LOGO_URL + '" alt="FED">' +
    '<div class="badge-name badge-temp-title">TEMPORARY<br>BADGE</div>' +
    '<div class="badge-role" style="color:#b9740a;">Ask staff to assign</div>' +
    '<div class="badge-qr"><div data-qr="' + badgeID + '"></div><div class="badge-id">' + badgeID + '</div></div>' +
    '</div>';
}

function buildTempBadgeBackHTML(badgeID) {
  const verseHTML = '<div class="badge-back-verse">' + YEAR_VERSE_TEXT + ' <span class="ref">' + YEAR_VERSE_REF + '</span></div>';
  return '<div class="badge-back badge-temp"><div class="badge-back-rot">' +
    '<div class="badge-back-name">' + badgeID + '</div>' +
    '<div class="badge-back-emergency" style="color:#b9740a;">Shared Temporary Badge</div>' +
    '<div style="font-size:12px;color:#333;line-height:1.5;text-align:center;padding:6px 4px;">' +
    'This badge is shared. Please return it to the check-in table before leaving campus so it can be reassigned to the next person who needs it.' +
    '</div>' + verseHTML + '</div></div>';
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setQueueStatus(msg) { document.getElementById('queue-status').textContent = msg; }

async function fetchQueueFromServer() {
  const res = await fetch(QUEUE_BIN_URL + '/latest', { headers: { 'X-Master-Key': QUEUE_API_KEY } });
  if (!res.ok) throw new Error('jsonbin GET failed: ' + res.status);
  const data = await res.json();
  return (data.record && data.record.queue) ? data.record.queue : [];
}

async function saveQueueToServer(queueArr) {
  const res = await fetch(QUEUE_BIN_URL, {
    method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': QUEUE_API_KEY }, body: JSON.stringify({ queue: queueArr })
  });
  if (!res.ok) throw new Error('jsonbin PUT failed: ' + res.status);
}

async function refreshQueueFromServer() {
  setQueueStatus('Refreshing queue...');
  try {
    localQueue = await fetchQueueFromServer();
    renderQueueList();
    setQueueStatus('Queue refreshed. ' + localQueue.length + ' staged.');
  } catch (err) { setQueueStatus('Failed to refresh queue: ' + err.message); }
}

function renderQueueSearchResults() {
  const term = document.getElementById('queue-search').value.trim().toLowerCase();
  const resultsDiv = document.getElementById('queue-search-results');
  if (!allPeople.length) { resultsDiv.innerHTML = '<div class="queue-result-row already">Click Load Badges first to search people.</div>'; return; }
  if (!term) { resultsDiv.innerHTML = ''; return; }

  const queuedIDs = new Set(localQueue.map(q => q.personID));
  const matches = allPeople.filter(p => (p.displayName + ' ' + p.familyName).toLowerCase().includes(term)).slice(0, 20);
  if (!matches.length) { resultsDiv.innerHTML = '<div class="queue-result-row already">No matches.</div>'; return; }

  resultsDiv.innerHTML = matches.map(p => {
    const already = queuedIDs.has(p.personID);
    return `<label class="queue-result-row${already ? ' already' : ''}">
      <input type="checkbox" class="queue-select-cb" data-person-id="${p.personID}" ${already ? 'disabled' : ''} style="margin-right:8px;">
      ${p.displayName} <span style="color:#888;">(${p.role || 'Adult'}${p.familyName ? ', ' + p.familyName : ''})</span>
      ${already ? ' <span style="color:#aaa;font-style:italic;">— already staged</span>' : ''}
    </label>`;
  }).join('');
}

async function addSelectedToQueue() {
  const checked = Array.from(document.querySelectorAll('.queue-select-cb:checked'));
  if (!checked.length) { alert('Check one or more people in the search results first.'); return; }
  const idsToAdd = checked.map(cb => cb.getAttribute('data-person-id'));
  const peopleToAdd = allPeople.filter(p => idsToAdd.includes(p.personID));

  setQueueStatus('Adding to queue...');
  try {
    const serverQueue = await fetchQueueFromServer();
    const existingIDs = new Set(serverQueue.map(q => q.personID));
    peopleToAdd.forEach(p => {
      if (!existingIDs.has(p.personID)) {
        serverQueue.push({ personID: p.personID, displayName: p.displayName, role: p.role || 'Adult', familyName: p.familyName || '' });
        existingIDs.add(p.personID);
      }
    });
    await saveQueueToServer(serverQueue);
    localQueue = serverQueue;
    renderQueueList();
    renderQueueSearchResults();
    document.getElementById('queue-search').value = '';
    document.getElementById('queue-search-results').innerHTML = '';
    setQueueStatus('Added ' + peopleToAdd.length + ' to queue. ' + localQueue.length + ' staged.');
  } catch (err) { setQueueStatus('Failed to add to queue: ' + err.message); }
}

async function removeFromQueue(personID) {
  setQueueStatus('Removing from queue...');
  try {
    const serverQueue = await fetchQueueFromServer();
    const updated = serverQueue.filter(q => q.personID !== personID);
    await saveQueueToServer(updated);
    localQueue = updated;
    renderQueueList();
    setQueueStatus('Removed. ' + localQueue.length + ' staged.');
  } catch (err) { setQueueStatus('Failed to remove: ' + err.message); }
}

async function addTempBadgeToQueue() {
  const input = document.getElementById('temp-badge-input');
  let badgeID = input.value.trim().toUpperCase();
  if (!badgeID) { alert('Enter the badge ID first (e.g. TEMP-07).'); return; }
  if (!/^TEMP-/.test(badgeID)) badgeID = 'TEMP-' + badgeID.replace(/^TEMP[-\s]*/i, '');

  setQueueStatus('Adding temp badge to queue...');
  try {
    const serverQueue = await fetchQueueFromServer();
    if (serverQueue.some(q => q.isTemp && q.badgeID === badgeID)) {
      setQueueStatus('Badge ' + badgeID + ' is already staged.');
      return;
    }
    serverQueue.push({ isTemp: true, badgeID });
    await saveQueueToServer(serverQueue);
    localQueue = serverQueue;
    renderQueueList();
    input.value = '';
    setQueueStatus('Added ' + badgeID + ' to queue. ' + localQueue.length + ' staged.');
  } catch (err) { setQueueStatus('Failed to add temp badge: ' + err.message); }
}

async function removeTempFromQueue(badgeID) {
  setQueueStatus('Removing from queue...');
  try {
    const serverQueue = await fetchQueueFromServer();
    const updated = serverQueue.filter(q => !(q.isTemp && q.badgeID === badgeID));
    await saveQueueToServer(updated);
    localQueue = updated;
    renderQueueList();
    setQueueStatus('Removed. ' + localQueue.length + ' staged.');
  } catch (err) { setQueueStatus('Failed to remove: ' + err.message); }
}

async function clearQueue() {
  if (!confirm('Clear the entire shared queue for everyone? This cannot be undone.')) return;
  setQueueStatus('Clearing queue...');
  try { await saveQueueToServer([]); localQueue = []; renderQueueList(); setQueueStatus('Queue cleared.'); }
  catch (err) { setQueueStatus('Failed to clear queue: ' + err.message); }
}

function renderQueueList() {
  const listDiv = document.getElementById('queue-list');
  document.getElementById('queue-count').textContent = localQueue.length;
  if (!localQueue.length) { listDiv.innerHTML = '<div class="queue-result-row already">No one staged yet.</div>'; return; }
  listDiv.innerHTML = localQueue.map(q => {
    if (q.isTemp) {
      return `<div class="queue-item-row">
        <span><span class="queue-temp-tag">TEMP</span> ${q.badgeID}</span>
        <button class="queue-remove-btn" data-temp-id="${q.badgeID}">✕</button>
      </div>`;
    }
    return `<div class="queue-item-row">
      <span>${q.displayName} <span style="color:#888;">(${q.role}${q.familyName ? ', ' + q.familyName : ''})</span></span>
      <button class="queue-remove-btn" data-pid="${q.personID}">✕</button>
    </div>`;
  }).join('');
  listDiv.querySelectorAll('.queue-remove-btn[data-pid]').forEach(btn => {
    btn.addEventListener('click', () => removeFromQueue(btn.getAttribute('data-pid')));
  });
  listDiv.querySelectorAll('.queue-remove-btn[data-temp-id]').forEach(btn => {
    btn.addEventListener('click', () => removeTempFromQueue(btn.getAttribute('data-temp-id')));
  });
}

async function printQueue() {
  setQueueStatus('Loading latest queue before printing...');
  try { localQueue = await fetchQueueFromServer(); } catch (err) { setQueueStatus('Failed to load queue: ' + err.message); return; }
  if (!localQueue.length) { alert('The queue is empty — nothing to print.'); renderQueueList(); return; }

  const personEntries = localQueue.filter(q => !q.isTemp);
  const tempEntries   = localQueue.filter(q => q.isTemp);

  if (personEntries.length && !allPeople.length) {
    alert('Click Load Badges first — the queue has member badges staged and needs the loaded person/schedule data to build them.');
    return;
  }

  const queuedIDs = personEntries.map(q => q.personID);
  const peopleToPrint = allPeople.filter(p => queuedIDs.includes(p.personID));
  const missing = queuedIDs.length - peopleToPrint.length;
  if (missing > 0 && !confirm(missing + ' queued ' + (missing === 1 ? 'person is' : 'people are') + ' not in the currently loaded data (click Load Badges to refresh?). Continue printing the rest?')) return;
  if (!peopleToPrint.length && !tempEntries.length) { setQueueStatus('None of the queued items matched loaded data.'); return; }

  let pagesHTML = '';
  if (peopleToPrint.length) pagesHTML += buildPeoplePagesHTML(peopleToPrint);
  if (tempEntries.length)   pagesHTML += buildTempPagesHTML(tempEntries.map(q => q.badgeID));
  openPrintWindow(pagesHTML);

  const printedCount = peopleToPrint.length + tempEntries.length;
  try {
    await saveQueueToServer([]);
    localQueue = [];
    renderQueueList();
    setQueueStatus('Printed ' + printedCount + '. Queue cleared for all stations.');
  } catch (err) { setQueueStatus('Printed, but failed to clear shared queue: ' + err.message + ' — clear it manually with Clear Queue.'); }
}

document.getElementById('load-btn').addEventListener('click', loadAndRender);
document.getElementById('print-btn').addEventListener('click', openPrintView);
document.getElementById('add-to-queue-btn').addEventListener('click', addSelectedToQueue);
document.getElementById('add-temp-badge-btn').addEventListener('click', addTempBadgeToQueue);
document.getElementById('refresh-queue-btn').addEventListener('click', refreshQueueFromServer);
document.getElementById('print-queue-btn').addEventListener('click', printQueue);
document.getElementById('clear-queue-btn').addEventListener('click', clearQueue);
document.getElementById('queue-search').addEventListener('input', renderQueueSearchResults);
document.getElementById('filter-role').addEventListener('change', () => { if (allPeople.length) renderBadges(); });
document.getElementById('filter-search').addEventListener('input', () => { if (allPeople.length) renderBadges(); });
</script>
