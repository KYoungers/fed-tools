<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FED Campus Dashboard</title>
<style>
  :root {
    --bg: #eef3f8;
    --panel: #ffffff;
    --panel-alt: #f4f8fc;
    --border: #d9e3ee;
    --navy: #3f6a95;
    --navy-dark: #2f5578;
    --text: #1c2b3a;
    --text-soft: #5b7086;
    --red: #c0392b;
    --red-dark: #a5311f;
    --green: #1aa260;
    --amber: #b9740a;
    --error: #c0392b;
    --blue-accent: #2f7fc1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }

  #fed-nav { background: var(--red); padding: 8px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #fed-nav .label { color: #fff; font-size: 12px; font-weight: bold; margin-right: 8px; }
  #fed-nav a { padding: 5px 14px; background: var(--navy); color: #fff; border-radius: 5px; font-size: 12px; font-weight: bold; text-decoration: none; display: inline-block; }
  #fed-nav a:hover { background: var(--navy-dark); }
  #fed-nav a.current { background: var(--red-dark); }

  #fed-dash-header {
    background: var(--navy); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  #fed-dash-header img { height: 56px; width: auto; background: #fff; border-radius: 6px; padding: 3px; }
  #fed-dash-title { font-size: 20px; font-weight: bold; }
  #fed-dash-sub { font-size: 13px; color: #dfeaf5; }

  .count-cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .count-card { background: rgba(255,255,255,0.12); border-radius: 10px; padding: 10px 18px; text-align: center; min-width: 100px; }
  .count-number { font-size: 32px; font-weight: bold; color: #fff; }
  .count-label { font-size: 11px; color: #dfeaf5; }

  #fed-controls {
    background: var(--panel); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border);
  }
  .view-toggle { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toggle-btn {
    padding: 6px 18px; border-radius: 6px; border: none; background: var(--panel-alt); color: var(--navy-dark); font-size: 13px; font-weight: bold; cursor: pointer;
  }
  .toggle-btn.active { background: var(--navy); color: #fff; }
  .filter-btn {
    padding: 6px 16px; border-radius: 20px; border: none; background: var(--panel-alt); color: var(--navy-dark); font-size: 12px; font-weight: bold; cursor: pointer;
  }
  .filter-btn.active { background: var(--navy); color: #fff; }
  .sep { color: var(--border); margin: 0 4px; }
  #refresh-btn { padding: 7px 16px; background: var(--green); color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
  #refresh-btn:hover { background: #15804d; }
  #last-updated { font-size: 12px; color: var(--text-soft); }
  #checkout-all-btn { padding: 7px 16px; background: var(--red); color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
  #checkout-all-btn:hover { background: var(--red-dark); }

  #checkout-modal {
    position: fixed; inset: 0; background: rgba(20,30,40,0.55); z-index: 99999;
    display: none; align-items: center; justify-content: center;
  }
  #checkout-modal.show { display: flex; }
  #checkout-modal-box {
    background: var(--panel); border-radius: 10px; padding: 24px; max-width: 380px; width: 90%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  #checkout-modal-box h3 { font-size: 17px; margin-bottom: 10px; color: var(--text); }
  #checkout-modal-box p { font-size: 14px; color: var(--text-soft); margin-bottom: 18px; line-height: 1.5; }
  .checkout-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .checkout-modal-actions button {
    padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer;
  }
  #checkout-cancel-btn { background: var(--panel-alt); color: var(--text); }
  #checkout-cancel-btn:hover { background: var(--border); }
  #checkout-confirm-btn { background: var(--red); color: #fff; }
  #checkout-confirm-btn:hover { background: var(--red-dark); }
  #checkout-confirm-btn:disabled { opacity: 0.6; cursor: default; }
  #checkout-status { font-size: 12px; margin-top: 12px; color: var(--text-soft); min-height: 14px; }

  #fed-content { padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .empty-state { text-align: center; padding: 60px; color: var(--text-soft); grid-column: 1/-1; font-size: 16px; }

  .family-card { background: var(--panel); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 1px 3px rgba(20,30,40,0.06); }
  .family-header { background: var(--navy); color: #fff; padding: 8px 14px; font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  .family-count { font-size: 11px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px; }
  .member-row { display: flex; align-items: center; padding: 6px 14px; gap: 10px; border-bottom: 1px solid var(--panel-alt); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .member-name { font-size: 14px; color: var(--text); flex: 1; }
  .member-type { font-size: 11px; color: var(--text-soft); }
  .member-time { font-size: 11px; color: var(--text-soft); }

  .slot-block { background: var(--panel); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 1px 3px rgba(20,30,40,0.06); margin-bottom: 12px; grid-column: 1/-1; max-width: 480px; }
  .slot-header { background: var(--navy); color: #fff; padding: 8px 14px; font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  .slot-fill { font-size: 11px; padding: 2px 10px; border-radius: 10px; color: #fff; }
  .slot-row { display: flex; align-items: center; padding: 8px 14px; gap: 12px; border-bottom: 1px solid var(--panel-alt); }
  .slot-name { flex: 1; font-size: 13px; color: var(--text); }
  .slot-empty { color: var(--error); font-style: italic; }
  .slot-checked { color: var(--green); font-weight: bold; }
  .slot-assigned { font-size: 11px; color: var(--text-soft); }
  .slot-time { font-size: 11px; color: var(--text-soft); min-width: 50px; text-align: right; }

  #print-report-btn { padding: 6px 18px; border-radius: 6px; border: none; background: var(--navy); color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; }
  #print-report-btn:hover { background: var(--navy-dark); }

  .temp-section { grid-column: 1/-1; background: var(--panel); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }
  .temp-section-header { background: var(--navy); color: #fff; padding: 10px 16px; font-size: 15px; font-weight: bold; }
  .temp-table { width: 100%; border-collapse: collapse; }
  .temp-table th, .temp-table td { text-align: left; padding: 8px 14px; font-size: 13px; border-bottom: 1px solid var(--panel-alt); }
  .temp-table th { color: var(--text-soft); font-size: 11px; text-transform: uppercase; background: var(--panel-alt); }
  .temp-table td.temp-out { color: var(--text-soft); }
  .temp-badge-tag { display: inline-block; background: var(--panel-alt); color: var(--navy-dark); padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
  .temp-visit-count { color: var(--amber); font-weight: bold; }
  .temp-empty { padding: 20px; text-align: center; color: var(--text-soft); font-size: 13px; }

  @media print {
    #fed-nav, #fed-controls, #print-report-btn, #checkout-all-btn { display: none !important; }
    body { background: #fff; }
    .temp-section { border: 1px solid #999; box-shadow: none; }
  }

  /* ── Reports view (scoped so it can't touch the other views) ── */
  #rp-root { padding: 0; }
  #rp-root .rp-meta { font-size: 12px; color: var(--text-soft); margin: 0 0 10px; }
  #rp-root .rp-tabs, #rp-root .sub { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  #rp-root .rp-tabs button { border: 1px solid var(--navy); background: #fff; color: var(--navy-dark); padding: 7px 16px; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 6px; }
  #rp-root .rp-tabs button.on { background: var(--navy); color: #fff; }
  #rp-root .sub button { border: 1px solid var(--border); background: #fff; padding: 5px 12px; font-size: 12px; cursor: pointer; border-radius: 14px; color: var(--text); }
  #rp-root .sub button.on { background: var(--red); border-color: var(--red); color: #fff; }
  #rp-root .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: 0 0 12px; background: #fff; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
  #rp-root .bar label { display: block; font-size: 11px; color: var(--text-soft); margin-bottom: 2px; }
  #rp-root .bar input { padding: 6px 8px; font-size: 14px; border: 1px solid #b8c6d4; border-radius: 4px; }
  #rp-root .go { background: var(--navy); color: #fff; border: 0; padding: 8px 18px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }
  #rp-root .wrap { overflow-x: auto; }
  #rp-root table { border-collapse: collapse; width: 100%; background: #fff; margin: 6px 0 14px; border: 1px solid var(--border); }
  #rp-root th { background: var(--panel-alt); color: var(--text-soft); text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase; }
  #rp-root td { padding: 8px 12px; border-bottom: 1px solid var(--panel-alt); vertical-align: top; font-size: 13px; }
  #rp-root .cards { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  #rp-root .card { background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--navy); border-radius: 6px; padding: 8px 14px; min-width: 120px; }
  #rp-root .card b { display: block; font-size: 22px; color: var(--navy-dark); }
  #rp-root .card span { font-size: 12px; color: var(--text-soft); }
  #rp-root .pill { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 11px; font-weight: bold; color: #fff; background: #8a97a5; }
  #rp-root .pill.red { background: var(--red); } #rp-root .pill.green { background: var(--green); } #rp-root .pill.amber { background: var(--amber); } #rp-root .pill.navy { background: var(--navy); }
  #rp-root .note { background: #fff4e5; border-left: 4px solid var(--red); padding: 8px 12px; margin: 8px 0; font-size: 13px; border-radius: 4px; }
  #rp-root .muted { color: var(--text-soft); font-size: 12px; }
  #rp-root h3 { color: var(--navy-dark); border-bottom: 2px solid var(--red); padding-bottom: 3px; margin: 18px 0 6px; font-size: 16px; }
  #rp-root .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  #rp-root .badge { background: #fff; border: 1px solid var(--border); border-top: 4px solid var(--green); border-radius: 6px; padding: 8px 10px; font-size: 12px; }
  #rp-root .badge.out { border-top-color: var(--amber); } #rp-root .badge.overdue { border-top-color: var(--red); background: #fff3f1; }
  #rp-root .badge b { font-size: 14px; color: var(--navy-dark); display: block; }
  #rp-root .err { color: var(--red); padding: 12px; background: #fff; border: 1px solid var(--red); border-radius: 6px; }
  #rp-root .loading { color: var(--text-soft); padding: 12px; }
  #rp-root details { background: #fff; border: 1px solid var(--border); border-radius: 6px; margin: 6px 0; padding: 8px 12px; }
  #rp-root summary { cursor: pointer; font-size: 13px; }
  @media print { #rp-root .bar, #rp-root .rp-tabs, #rp-root .sub { display: none !important; } }
</style>
</head>
<body>

<div id="fed-nav">
  <span class="label">FED Admin:</span>
  <a href="dashboard.html" class="current">Campus Dashboard</a>
  <a href="badge-generator.html">Badge Generator</a>
  <a href="attendance-kiosk.html">Attendance Kiosk</a>
  <a href="service-kiosk.html">Service Kiosk</a>
</div>

<div id="fed-dash-header">
  <div style="display:flex;align-items:center;gap:12px;">
    <img src="https://www.familyeducationdays.com/tx/familyeducationdays/2026/26-27%20Logo.png" alt="FED">
    <div>
      <div id="fed-dash-title">Campus Dashboard</div>
      <div id="fed-dash-sub">Live view of who is currently on campus</div>
    </div>
  </div>
  <div class="count-cards">
    <div class="count-card"><div class="count-number" id="count-total">—</div><div class="count-label">Total</div></div>
    <div class="count-card"><div class="count-number" id="count-parents">—</div><div class="count-label">Parents</div></div>
    <div class="count-card"><div class="count-number" id="count-students">—</div><div class="count-label">Students</div></div>
    <div class="count-card"><div class="count-number" id="count-adults">—</div><div class="count-label">Approved Adults</div></div>
  </div>
</div>

<div id="fed-controls">
  <div class="view-toggle">
    <button class="toggle-btn active" id="view-attendance">Attendance</button>
    <button class="toggle-btn" id="view-serve">Serve Hours</button>
    <button class="toggle-btn" id="view-temp">Temp Badges</button>
    <button class="toggle-btn" id="view-reports">Reports</button>
    <span class="sep">|</span>
    <span id="attendance-filters" style="display:inline-flex;gap:8px;flex-wrap:wrap;">
      <button class="filter-btn active" id="filter-all" data-filter="all">All</button>
      <button class="filter-btn" id="filter-parents" data-filter="Parent">Parents</button>
      <button class="filter-btn" id="filter-students" data-filter="Student">Students</button>
      <button class="filter-btn" id="filter-adults" data-filter="Approved Adult">Approved Adults</button>
    </span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="last-updated">Not yet loaded</span>
    <button id="refresh-btn">Refresh</button>
    <button id="print-report-btn" style="display:none;">Print Report</button>
    <button id="checkout-all-btn">Check Everyone Out</button>
  </div>
</div>

<div id="fed-content">
  <div class="empty-state">Loading campus data...</div>
</div>

<div id="checkout-modal">
  <div id="checkout-modal-box">
    <h3>Check everyone out?</h3>
    <p id="checkout-modal-text">This will check out everyone currently on campus.</p>
    <div class="checkout-modal-actions">
      <button id="checkout-cancel-btn">Cancel</button>
      <button id="checkout-confirm-btn">Check Everyone Out</button>
    </div>
    <div id="checkout-status"></div>
  </div>
</div>

<script>
const WEBAPP = 'https://script.google.com/macros/s/AKfycbxQTULyjaWTitjvrbaTp3SNgrTggvkQHUuL_A5ps5naR6egVj3OGAUUL_o0sdZK9Bdo/exec';
let people  = [];
let slots   = [];
let serveActivity = []; // everyone who served a slot at any point today — see getServeActivityToday
let tempActivity = { members: [], visitors: [] };
let filter  = 'all';
let view    = 'attendance';

function setView(v) {
  view = v;
  document.getElementById('view-attendance').classList.toggle('active', v === 'attendance');
  document.getElementById('view-serve').classList.toggle('active', v === 'serve');
  document.getElementById('view-temp').classList.toggle('active', v === 'temp');
  document.getElementById('view-reports').classList.toggle('active', v === 'reports');
  document.getElementById('attendance-filters').style.display = v === 'attendance' ? 'inline-flex' : 'none';
  document.getElementById('print-report-btn').style.display = v === 'temp' ? 'inline-block' : 'none';
  if (v === 'temp') loadTempBadgeData();
  if (v === 'reports') { RP.open(); return; }
  render();
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

async function loadData() {
  try {
    const [attendRes, slotsRes, serveRes] = await Promise.all([
      fetch(WEBAPP + '?action=getCurrentlyIn'),
      fetch(WEBAPP + '?action=getSlots'),
      fetch(WEBAPP + '?action=getServeActivityToday')
    ]);
    people  = (await attendRes.json()).people || [];
    slots   = (await slotsRes.json()).slots   || [];
    serveActivity = (await serveRes.json()).activity || [];
    render();
    document.getElementById('last-updated').textContent =
      'Updated: ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  } catch(e) {
    document.getElementById('fed-content').innerHTML =
      '<div class="empty-state" style="color:var(--error);">Error: ' + e.message + '</div>';
  }
}

let outstandingBadges = {};

async function loadTempBadgeData() {
  try {
    const [activityRes, liveRes] = await Promise.all([
      fetch(WEBAPP + '?action=getTempBadgeActivity'),
      fetch(WEBAPP + '?action=getTempBadges')
    ]);
    tempActivity = await activityRes.json();
    outstandingBadges = (await liveRes.json()).tempBadges || {};
  } catch(e) {
    tempActivity = { members: [], visitors: [] };
    outstandingBadges = {};
  }
  if (view === 'temp') render();
}

function render() {
  if (view === 'reports') return; // reports draw themselves; don't wipe them on the 5-minute refresh
  if (view === 'serve') renderServe();
  else if (view === 'temp') renderTemp();
  else renderAttendance();
}

// Reads 'yyyy-mm-dd H:mm:ss' text as local time, or a full ISO/Date value as-is.
function parseStamp(t) {
  if (!t) return null;
  const s = String(t).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

// 'Fri Oct 9, 8:44 AM'
function formatSince(t) {
  const d = parseStamp(t);
  if (!d) return t ? String(t) : '';
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' +
         d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

// Whole calendar days between the stamp and today (0 = today).
function daysOutFrom(t) {
  const d = parseStamp(t);
  if (!d) return null;
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const now = new Date();
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((b - a) / 86400000);
}

function formatClock(t) {
  if (!t) return '';
  try { return new Date(t).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }); }
  catch(e) { return t; }
}

function renderTemp() {
  const content = document.getElementById('fed-content');
  content.style.display = 'block';

  const members  = tempActivity.members  || [];
  const visitors = tempActivity.visitors || [];

  const memberRows = members.length === 0
    ? '<div class="temp-empty">No temp badges used by members today.</div>'
    : `<table class="temp-table">
        <thead><tr><th>Time</th><th>Name</th><th>Family</th><th>Badge</th><th>Direction</th></tr></thead>
        <tbody>${members.map(m => `
          <tr>
            <td>${formatClock(m.time)}</td>
            <td>${m.displayName}</td>
            <td>${m.familyName}</td>
            <td><span class="temp-badge-tag">${m.badgeID}</span></td>
            <td class="${m.direction === 'OUT' ? 'temp-out' : ''}">${m.direction}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;

  const visitorRows = visitors.length === 0
    ? '<div class="temp-empty">No visitors logged today.</div>'
    : `<table class="temp-table">
        <thead><tr><th>Name</th><th>Phone</th><th>Responsible Family</th><th>Badge</th><th>In</th><th>Out</th><th>Visits</th></tr></thead>
        <tbody>${visitors.map(v => `
          <tr>
            <td>${v.displayName}</td>
            <td>${v.phone}</td>
            <td>${v.hostFamily}</td>
            <td><span class="temp-badge-tag">${v.badgeID}</span></td>
            <td>${formatClock(v.checkInTime)}</td>
            <td class="temp-out">${v.checkOutTime ? formatClock(v.checkOutTime) : '— not returned —'}</td>
            <td class="temp-visit-count">${v.visitCount}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;

  // Oldest first, so anything that has been out for days is at the top.
  const outstandingIDs = Object.keys(outstandingBadges).sort((a, b) => {
    const da = parseStamp(outstandingBadges[a].assignedTime), db = parseStamp(outstandingBadges[b].assignedTime);
    return (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
  });
  const staleCount = outstandingIDs.filter(id => (daysOutFrom(outstandingBadges[id].assignedTime) || 0) > 0).length;
  const outstandingRows = outstandingIDs.length === 0
    ? '<div class="temp-empty">No temp badges are currently outstanding — all accounted for.</div>'
    : `<table class="temp-table">
        <thead><tr><th>Badge</th><th>Held By</th><th>Family / Host</th><th>Since</th></tr></thead>
        <tbody>${outstandingIDs.map(badgeID => {
          const b = outstandingBadges[badgeID];
          const isGuest = b.personID === 'GUEST';
          const days = daysOutFrom(b.assignedTime);
          const dayTag = days === null ? '' : days > 0
            ? ` <span style="font-size:11px;font-weight:bold;color:#fff;background:var(--red);padding:1px 8px;border-radius:10px;">${days} day${days === 1 ? '' : 's'} out</span>`
            : ' <span style="font-size:11px;color:var(--text-soft);">today</span>';
          return `<tr>
            <td><span class="temp-badge-tag" style="background:${isGuest ? 'var(--amber-bg,#fdf3e0)' : 'var(--panel-alt)'};">${badgeID}</span></td>
            <td>${b.displayName}${isGuest ? ' <span style="font-size:10px;color:var(--amber);font-weight:bold;">VISITOR</span>' : ''}</td>
            <td>${b.familyName}</td>
            <td>${formatSince(b.assignedTime)}${dayTag}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>`;

function renderAttendance() {
  const filtered = filter === 'all' ? people : people.filter(p => p.type === filter);
  document.getElementById('count-total').textContent    = people.length;
  document.getElementById('count-parents').textContent  = people.filter(p => p.type === 'Parent').length;
  document.getElementById('count-students').textContent = people.filter(p => p.type === 'Student').length;
  document.getElementById('count-adults').textContent   = people.filter(p => p.type === 'Approved Adult').length;

  const content = document.getElementById('fed-content');
  content.style.display = 'grid';
  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty-state">${filter === 'all' ? 'No one is currently on campus.' : 'No ' + filter + 's currently on campus.'}</div>`;
    return;
  }

  const families = {};
  filtered.forEach(p => {
    const key = p.familyID || 'unknown';
    if (!families[key]) families[key] = { familyName: p.familyName || 'Unknown', members: [] };
    families[key].members.push(p);
  });
  const sorted = Object.values(families).sort((a, b) => a.familyName.localeCompare(b.familyName));

  content.innerHTML = sorted.map(fam => {
    const order = { Parent: 0, Student: 1, 'Approved Adult': 2 };
    const members = fam.members.sort((a, b) => (order[a.type] || 0) - (order[b.type] || 0));
    const rows = members.map(m => {
      const dot = m.type === 'Parent' ? '#1aa260' : m.type === 'Student' ? '#b9740a' : '#7a5fb0';
      const time = m.checkInTime ? new Date(m.checkInTime).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';
      return `<div class="member-row">
        <div class="dot" style="background:${dot};"></div>
        <div class="member-name">${m.displayName}</div>
        <div class="member-type">${m.type}</div>
        <div class="member-time">${time}</div>
      </div>`;
    }).join('');
    return `<div class="family-card">
      <div class="family-header"><span>${fam.familyName}</span><span class="family-count">${members.length} member${members.length !== 1 ? 's' : ''}</span></div>
      <div>${rows}</div>
    </div>`;
  }).join('');
}

function renderServe() {
  const content = document.getElementById('fed-content');
  if (slots.length === 0) {
    content.innerHTML = '<div class="empty-state">No slots loaded. Make sure slots are synced in the sheet.</div>';
    return;
  }

  // Keyed by slotID — anyone who served this slot at any point today, whether
  // they're still there or already checked out. See getServeActivityToday.
  const serveMap = {};
  serveActivity.forEach(s => { serveMap[s.slotID] = s; });

  const timeGroups = {};
  slots.forEach(slot => {
    const tb = slot.timeBlock || 'Unknown Time';
    if (!timeGroups[tb]) timeGroups[tb] = [];
    timeGroups[tb].push(slot);
  });

  function formatTimeBlock(tb) {
    if (tb.includes('1899') || tb.includes('GMT')) {
      try { return new Date(tb).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }); } catch(e) {}
    }
    return tb;
  }

  const sortedTimes = Object.keys(timeGroups).sort();
  content.style.display = 'block';
  content.innerHTML = sortedTimes.map(time => {
    const slotList = timeGroups[time];
    const rows = slotList.map(slot => {
      const served = serveMap[slot.slotID];
      const assignedStr = slot.assignedFamily ? `<span class="slot-assigned">(${slot.assignedFamily})</span>` : '';
      let nameStr, timeStr;
      if (served) {
        const label = served.stillIn ? '✓ ' : '✓ ' + '(done) ';
        nameStr = `<span class="slot-checked">${label}${served.displayName || 'Unknown'}</span> ${assignedStr}`;
        timeStr = served.checkInTime ? new Date(served.checkInTime).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';
        if (!served.stillIn && served.checkOutTime) {
          timeStr += ' – ' + new Date(served.checkOutTime).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }
      } else {
        nameStr = `<span class="slot-empty">Empty</span> ${assignedStr}`;
        timeStr = '';
      }
      return `<div class="slot-row">
        <div class="slot-name">${slot.slotName}</div>
        <div>${nameStr}</div>
        <div class="slot-time">${timeStr}</div>
      </div>`;
    }).join('');
    const filledCount = slotList.filter(s => serveMap[s.slotID]).length;
    const fillColor = filledCount === slotList.length ? '#1aa260' : filledCount === 0 ? '#c0392b' : '#b9740a';
    return `<div class="slot-block">
      <div class="slot-header"><span>${formatTimeBlock(time)}</span><span class="slot-fill" style="background:${fillColor};">${filledCount}/${slotList.length} filled today</span></div>
      ${rows}
    </div>`;
  }).join('');
}

function openCheckoutModal() {
  const n = people.length;
  document.getElementById('checkout-modal-text').textContent =
    n === 0
      ? 'No one is currently checked in on campus.'
      : n + (n === 1 ? ' person is' : ' people are') + ' currently on campus. This will check all of them out at once. This cannot be undone.';
  document.getElementById('checkout-status').textContent = '';
  const confirmBtn = document.getElementById('checkout-confirm-btn');
  confirmBtn.disabled = n === 0;
  document.getElementById('checkout-modal').classList.add('show');
}

function closeCheckoutModal() {
  document.getElementById('checkout-modal').classList.remove('show');
}

async function confirmCheckoutAll() {
  const btn = document.getElementById('checkout-confirm-btn');
  btn.disabled = true;
  document.getElementById('checkout-status').textContent = 'Checking everyone out...';
  try {
    const res  = await fetch(WEBAPP, { method: 'POST', body: JSON.stringify({ action: 'checkOutAll' }) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    document.getElementById('checkout-status').textContent = 'Done — ' + (data.count || 0) + ' checked out.';
    await loadData();
    setTimeout(closeCheckoutModal, 1200);
  } catch (e) {
    document.getElementById('checkout-status').textContent = 'Error: ' + e.message;
    btn.disabled = false;
  }
}

document.getElementById('checkout-all-btn').addEventListener('click', openCheckoutModal);
document.getElementById('checkout-cancel-btn').addEventListener('click', closeCheckoutModal);
document.getElementById('checkout-confirm-btn').addEventListener('click', confirmCheckoutAll);

    if(j.notSynced.length) h+='<h3>On BGChecks tab but not on People ('+j.notSynced.length+')</h3>'+tbl(['Name','Family','Date on BGChecks'],j.notSynced.map(function(m){return [esc(m.name),esc(m.familyName),dfmt(m.bgChecksDate)];}));
    if(j.orphans.length) h+='<h3>On BGChecks tab, not found on People ('+j.orphans.length+')</h3>'+tbl(['Name','Person ID','Date'],j.orphans.map(function(m){return [esc(m.name),esc(m.personID),dfmt(m.date)];}));
    if(j.expiring.length) h+='<h3>Due for renewal</h3>'+tbl(['Name','Family','Check date','Days old'],j.expiring.map(function(m){return [esc(m.name),esc(m.familyName),dfmt(m.date),m.ageDays];}));
    return h;
  });
}

// ─── entry points used by the dashboard ─────────────────────────────────────
function open(){
  var c = document.getElementById('fed-content');
  c.style.display = 'block';
  c.innerHTML = '<div id="rp-root"><div class="rp-meta" id="rp-meta"></div><div class="rp-tabs" id="rp-nav"></div><div id="rp-main"></div></div>';
  drawPage();
  api({r:'ping'}).then(function(j){
    state.info = j;
    if($('rp-meta')) $('rp-meta').textContent = 'Last class day: ' + dfmt(j.lastClassDay) + '  |  ' + j.classDays.length + ' class days this year';
    if(state.tab==='att' && state.sub.att==='day') drawPage();
  }).catch(function(){});
}
function refresh(){ if($('rp-root')) drawPage(); }
window.RP = { open: open, refresh: refresh };
})();
</script>
